name: cat_fish
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# App versioning
version: 1.0.0+1

# Dart SDK version
environment:
  sdk: ^3.8.1

# ----------------------------------------
# Dependencies for your Flutter project
# ----------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Flame game engine
  flame: ^1.32.0

# ----------------------------------------
# Development-only dependencies
# ----------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lint rules
  flutter_lints: ^5.0.0

# ----------------------------------------
# Flutter-specific configuration
# ----------------------------------------
flutter:
  # Enables Material Icons
  uses-material-design: true

  # Asset folder for images, sprites, etc.
  assets:
    - assets/images/

  # Default mode: Material (can be customized later)
  # To switch to Cupertino or custom UI, update your main.dart and theme setup

  # Example font setup (optional)
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700